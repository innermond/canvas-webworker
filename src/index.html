<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konva.js Draw Path on Click & Upload Image</title>
    <script src="konva.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="buttonContainer">
    <button id="doSelect" class="button inactive doSelect" title="Select mode"></button>
    <button id="doDrawPath" class="button inactive doDrawPath" title="Draw Path"></button>
    <button id="doAddNodePath" class="button inactive doAddNodePath" title="Add node path"></button>
    <button id="doChangeNodePath" class="button inactive doChangeNodePath" title="Change node type"></button>
    <button id="doDeleteNodePath" class="button inactive doDeleteNodePath" title="Delete node path"></button>
      <button id="doMagneticNode" class="button inactive doMagneticNode" title="Magnetic node"></button>
    <div class="color-opacity-combo">
      <input type="color" id="fillColorPicker" class="color-picker" title="Choose Fill Color" />
      <input id="opacityInput" type="number" min="0" max="100" class="inactive" title="Color Opacity" />
      </div>
      <label for="blendModes">
        <select id="blendModes">
          <option value="source-over">source-over (Default)</option>
          <option value="source-in">source-in</option>
          <option value="source-out">source-out</option>
          <option value="source-atop">source-atop</option>
          <option value="destination-over">destination-over</option>
          <option value="destination-in">destination-in</option>
          <option value="destination-out">destination-out</option>
          <option value="destination-atop">destination-atop</option>
          <option value="lighter">lighter</option>
          <option value="copy">copy</option>
          <option value="xor">xor</option>
          <option value="multiply">multiply</option>
          <option value="screen">screen</option>
          <option value="overlay">overlay</option>
          <option value="darken">darken</option>
          <option value="lighten">lighten</option>
          <option value="color-dodge">color-dodge</option>
          <option value="color-burn">color-burn</option>
          <option value="hard-light">hard-light</option>
          <option value="soft-light">soft-light</option>
          <option value="difference">difference</option>
          <option value="exclusion">exclusion</option>
          <option value="hue">hue</option>
          <option value="saturation">saturation</option>
          <option value="color">color</option>
          <option value="luminosity">luminosity</option>
        </select>
        <div>Blend mode:</div>
      </label>
    <button id="doFill" class="button inactive doFill" title="Fill Path"></button>
    <button id="doMagikWand" class="button inactive doMagikWand" title="Magik Wand"></button>
    <button id="fillSelectionImageButton" class="button inactive">Fill selection from image</button>
    <button id="doBucket" class="button inactive">Fill Image With Color</button>
    <label class="button-like" for="fillImageSensitivityButton"> <div>Fill Sensitivity <span id="fillImageSensitivityLabel"></span></div>
      <input type="range" min="0" max="100" id="fillImageSensitivityButton" value="25" />
    </label>
    <button id="doDrawPencil" class="button inactive doDrawPencil" title="Draw with Pencil"></button>
    <div id="pencilShapes">
        <label>
            <input type="radio" name="pencilShape" value="rectangle">
            Rectangle
        </label>
        
        <label>
            <input type="radio" name="pencilShape" value="circle">
            Circle
        </label>
        
        <label>
            <input type="radio" name="pencilShape" value="rhomb">
            Rhomb
        </label>      
    </div>
    <label for="drawProtectCheckbox">
      <input type="checkbox" id="drawProtectCheckbox" value="1" />
      <div>Protect painted areas <span id="drawProtectLabel"></span></div>
    </label>
    <label for="fillCleanCheckbox">
      <input type="checkbox" id="fillCleanCheckbox" value="1" />
      <div>Remove mode <span id="fillCleanCheckboxLabel"></span></div>
    </label>
    <label class="button-like" for="scalePencilButton"> <div>Pencil scale <span id="scalePencilLabel"></span></div>
      <input type="range" min="1" max="100" id="scalePencilButton" value="30" />
    </label>
    <label class="button-like" for="zoomButton"> <div>Zoom scale <span id="zoomButtonLabel"></span></div>
      <input type="range" min="0" max="1" id="zoomButton" />
    </label>
    <button id="doDrag" class="button inactive doDrag" title="Drag mode"></button>
    <button id="upz" class="button doUpz" title="Up"></button>
    <button id="downz" class="button doDownz" title="Down"></button>
    <button id="doDelete" class="button doDelete" disabled title="Delete Current Path/Image"></button>
    <button id="doDeleteAll" class="button doDeleteAll" title="Clear all"></button>
    <button id="doDropShape" class="button doDropShape" title="Drop shape"></button>
      <button id="doDropShapeAll" class="button doDropShapeAll" title="Drop all shapes"></button>
    <label class="button-like doUploadImage" for="uploadImageButton" title="Upload image"> 
      <input type="file" id="uploadImageButton" class="file-input" accept="image/*" />
    </label>
</div>

<!-- Canvas Container -->
<div id="container" style="width: 800px; height: 400px"></div>
<!-- Reference to external JavaScript file -->
<script src="script.js" type="module"></script>

<!-- Debug canvases -->
<div style="position: relative; border: 2px solid red">
  <div id="debug" >
    <canvas/>
  </div>
</div>

</body>
</html>
